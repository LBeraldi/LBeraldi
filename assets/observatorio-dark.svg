<svg xmlns="http://www.w3.org/2000/svg" width="300" height="140" viewBox="0 0 300 140" role="img" aria-label="Observatório de Saneamento — Indicadores de saneamento de MS">
<title>Observatório de Saneamento</title>
<style>
@keyframes pulse { 0% { r: 3.5; opacity: .9; } 70%, 100% { r: 8; opacity: 0; } }
@keyframes grow { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.6); } }
@keyframes turn { to { transform: rotate(360deg); } }
.ring { animation: pulse 2s ease-out infinite; }
.bar { transform-box: fill-box; transform-origin: bottom; animation: grow 3s ease-in-out infinite; }
.b2 { animation-delay: .5s; } .b3 { animation-delay: 1s; }
.spin { transform-box: fill-box; transform-origin: center; animation: turn 14s linear infinite; }
.status { font: 600 10.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #3fb265; letter-spacing: .4px; }
.title { font: 700 16.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #e6edf3; }
.desc { font: 400 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #9aa7b4; }
.chip { font: 500 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #9ec2f5; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="1" y="1" width="298" height="138" rx="12" fill="#161b22" stroke="#30363d"/>
<circle class="ring" cx="22" cy="25" r="3.5" fill="#7ad89a"/>
<circle cx="22" cy="25" r="3.5" fill="#3fb265"/>
<text class="status" x="32" y="29">EM PRODUÇÃO</text>
<text class="title" x="18" y="60">Observatório de Saneamento</text>
<text class="desc" x="18" y="82">Indicadores de saneamento de MS</text>
<rect x="18.0" y="102" width="62.2" height="20" rx="10" fill="#1c2a3d"/><text x="49.1" y="116" text-anchor="middle" class="chip">Next.js</text>
<rect x="86.2" y="102" width="62.2" height="20" rx="10" fill="#1c2a3d"/><text x="117.3" y="116" text-anchor="middle" class="chip">FastAPI</text>
<rect x="154.4" y="102" width="62.2" height="20" rx="10" fill="#1c2a3d"/><text x="185.5" y="116" text-anchor="middle" class="chip">PostGIS</text>
<g transform="translate(262 11) scale(0.75)"><path d="M16 1 C16 1 3 15 3 24 a13 13 0 0 0 26 0 C29 15 16 1 16 1Z" fill="#6fa3ef" fill-opacity="0.16" stroke="#6fa3ef" stroke-width="1.8"/>
<rect class="bar" x="9.5" y="24" width="3.6" height="8" rx="1" fill="#3fb265"/>
<rect class="bar b2" x="14.3" y="19" width="3.6" height="13" rx="1" fill="#3fb265"/>
<rect class="bar b3" x="19.1" y="22" width="3.6" height="10" rx="1" fill="#3fb265"/></g>
</svg>
