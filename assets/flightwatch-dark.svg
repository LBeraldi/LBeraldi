<svg xmlns="http://www.w3.org/2000/svg" width="300" height="140" viewBox="0 0 300 140" role="img" aria-label="Flight Watch — Monitor de preços de passagens">
<title>Flight Watch</title>
<style>
@keyframes pulse { 0% { r: 3.5; opacity: .9; } 70%, 100% { r: 8; opacity: 0; } }
@keyframes grow { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.6); } }
@keyframes turn { to { transform: rotate(360deg); } }
.ring { animation: pulse 2s ease-out infinite; }
.bar { transform-box: fill-box; transform-origin: bottom; animation: grow 3s ease-in-out infinite; }
.b2 { animation-delay: .5s; } .b3 { animation-delay: 1s; }
.spin { transform-box: fill-box; transform-origin: center; animation: turn 14s linear infinite; }
.status { font: 600 10.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #6fa3ef; letter-spacing: .4px; }
.title { font: 700 16.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #e6edf3; }
.desc { font: 400 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #9aa7b4; }
.chip { font: 500 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #9ec2f5; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="1" y="1" width="298" height="138" rx="12" fill="#161b22" stroke="#30363d"/>
<circle class="ring" cx="22" cy="25" r="3.5" fill="#9ec2f5"/>
<circle cx="22" cy="25" r="3.5" fill="#6fa3ef"/>
<text class="status" x="32" y="29">EM CONSTRUÇÃO</text>
<text class="title" x="18" y="60">Flight Watch</text>
<text class="desc" x="18" y="82">Monitor de preços de passagens</text>
<rect x="18.0" y="102" width="82.0" height="20" rx="10" fill="#1c2a3d"/><text x="59.0" y="116" text-anchor="middle" class="chip">TypeScript</text>
<rect x="106.0" y="102" width="68.8" height="20" rx="10" fill="#1c2a3d"/><text x="140.4" y="116" text-anchor="middle" class="chip">Postgres</text>
<rect x="180.8" y="102" width="49.0" height="20" rx="10" fill="#1c2a3d"/><text x="205.3" y="116" text-anchor="middle" class="chip">Redis</text>
<g transform="translate(262 11) scale(0.75)"><path id="route" d="M2 32 Q16 2 36 12" fill="none" stroke="#6fa3ef" stroke-width="1.4" stroke-dasharray="2.5 3.5" stroke-linecap="round" opacity=".7"/>
<circle cx="2" cy="32" r="2.4" fill="#6fa3ef"/>
<circle cx="36" cy="12" r="2.4" fill="none" stroke="#6fa3ef" stroke-width="1.4"/>
<path d="M-6 -1 L1.5 -1 L4 -5 L5.6 -5 L4.2 -1 L7 -1 Q9 0 7 1 L4.2 1 L5.6 5 L4 5 L1.5 1 L-6 1 L-7.5 -2.8 L-6.3 -2.8 Z" fill="#e6edf3">
<animateMotion dur="4.5s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion>
</path></g>
</svg>
