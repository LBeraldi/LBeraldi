<svg xmlns="http://www.w3.org/2000/svg" width="300" height="140" viewBox="0 0 300 140" role="img" aria-label="Portal de Resíduos — Gestão de resíduos sólidos em MS">
<title>Portal de Resíduos</title>
<style>
@keyframes pulse { 0% { r: 3.5; opacity: .9; } 70%, 100% { r: 8; opacity: 0; } }
@keyframes grow { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.6); } }
@keyframes turn { to { transform: rotate(360deg); } }
.ring { animation: pulse 2s ease-out infinite; }
.bar { transform-box: fill-box; transform-origin: bottom; animation: grow 3s ease-in-out infinite; }
.b2 { animation-delay: .5s; } .b3 { animation-delay: 1s; }
.spin { transform-box: fill-box; transform-origin: center; animation: turn 14s linear infinite; }
.status { font: 600 10.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #18765a; letter-spacing: .4px; }
.title { font: 700 16.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #0c2d57; }
.desc { font: 400 12.5px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #4b5d73; }
.chip { font: 500 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #1f5aa6; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="1" y="1" width="298" height="138" rx="12" fill="#f6f9fc" stroke="#d8e1eb"/>
<circle class="ring" cx="22" cy="25" r="3.5" fill="#3fb265"/>
<circle cx="22" cy="25" r="3.5" fill="#18765a"/>
<text class="status" x="32" y="29">EM PRODUÇÃO</text>
<text class="title" x="18" y="60">Portal de Resíduos</text>
<text class="desc" x="18" y="82">Gestão de resíduos sólidos em MS</text>
<rect x="18.0" y="102" width="82.0" height="20" rx="10" fill="#e7f0f8"/><text x="59.0" y="116" text-anchor="middle" class="chip">TypeScript</text>
<rect x="106.0" y="102" width="42.4" height="20" rx="10" fill="#e7f0f8"/><text x="127.2" y="116" text-anchor="middle" class="chip">Vite</text>
<rect x="154.4" y="102" width="55.6" height="20" rx="10" fill="#e7f0f8"/><text x="182.2" y="116" text-anchor="middle" class="chip">testes</text>
<g transform="translate(262 11) scale(0.75)"><circle cx="16" cy="17" r="15" fill="#18765a" fill-opacity="0.14" stroke="#18765a" stroke-width="1.8"/>
<g class="spin"><path d="M8.5 17 a7.5 7.5 0 0 1 12.8-5.3" fill="none" stroke="#18765a" stroke-width="2" stroke-linecap="round"/>
<path d="M21.3 8 l.8 4.4 -4.4 0" fill="none" stroke="#18765a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M23.5 17 a7.5 7.5 0 0 1 -12.8 5.3" fill="none" stroke="#1f5aa6" stroke-width="2" stroke-linecap="round"/>
<path d="M10.7 26 l-.8 -4.4 4.4 0" fill="none" stroke="#1f5aa6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
</svg>
